core_concepts:
  - name: Smart Event
    detail: >-
      An event-based, pre-set trigger that defines the conditions under which
      the Heex agent captures a small, relevant package of data ("Smart-Data")
      at the edge or in the cloud.
  - name: Trigger
    detail: Conditions/signals that fire a Smart Event.
  - name: Signal
    detail: Input stream/values evaluated by triggers.
  - name: Recording
    detail: The captured data package associated with a fired event.
  - name: Datasource
    detail: A source of data an agent monitors (e.g. ROS/ROS2 topics).
  - name: Agent
    detail: >-
      Heex software agent deployed on the autonomous system (Ubuntu x86_64/ARM,
      ROS/ROS2), reprogrammable over-the-air from the central platform.
